name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'release (needs keystore secrets) or debug'
        type: choice
        options: [release, debug]
        default: release
  push:
    tags:
      - 'v*'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Use Taobao npm mirror
        run: |
          npm config set registry https://registry.npmmirror.com
          sed -i 's|https://registry.npmjs.org|https://registry.npmmirror.com|g' package-lock.json

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-${{ runner.os }}-

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: android-${{ hashFiles('src-tauri/Cargo.lock') }}
          shared-key: rapidraw-android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Android NDK r26d
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('src-tauri/gen/android/**/*.gradle*', 'src-tauri/gen/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Configure release signing
        if: ${{ github.event_name != 'pull_request' }}
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEY_BASE64:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "No keystore secrets found - generating an ephemeral release key."
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/keystore.jks" \
              -alias rapidraw -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass rapidraw -keypass rapidraw \
              -dname "CN=RapidRAW, OU=Build, O=RapidRAW, L=NA, S=NA, C=US"
            cd src-tauri/gen/android
            echo "keyAlias=rapidraw" > keystore.properties
            echo "password=rapidraw" >> keystore.properties
            echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties
            exit 0
          fi
          cd src-tauri/gen/android
          echo "keyAlias=${ANDROID_KEY_ALIAS}" > keystore.properties
          echo "password=${ANDROID_KEY_PASSWORD}" >> keystore.properties
          echo "${ANDROID_KEY_BASE64}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Build APK
        shell: bash
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ORT_SKIP_DOWNLOAD: '1'
          ORT_STRATEGY: manual
          ORT_LIB_LOCATION: ${{ github.workspace }}/src-tauri/libs/arm64-v8a
          CARGO_PROFILE_RELEASE_STRIP: 'true'
        run: |
          set -euo pipefail
          mkdir -p src-tauri/libs/arm64-v8a
          ARGS="--apk --target aarch64"
          REQUESTED="${{ github.event.inputs.build_type }}"
          if [ "${REQUESTED}" = "debug" ] || [ ! -f src-tauri/gen/android/keystore.properties ]; then
            ARGS="${ARGS} --debug"
            echo "Building debug-signed APK"
          else
            echo "Building release-signed APK"
          fi
          npx tauri android build ${ARGS} --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RapidRAW-android-${{ github.ref_name }}
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab
          retention-days: 7
          compression-level: 6
          if-no-files-found: error

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          files=(src-tauri/gen/android/app/build/outputs/**/*.apk)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No APK found"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/release"
          for f in "${files[@]}"; do
            cp "$f" "$RUNNER_TEMP/release/RapidRAW_${GITHUB_REF_NAME}_android_arm64_$(basename "$f")"
          done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Android build"
          gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* --clobber
